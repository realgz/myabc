# myabc 配置样例 —— 复制到 %APPDATA%\myabc\config.toml 后按需修改。
# 依据 docs/architecture/system-overview.md §5。所有键都有编译期默认值
# （src/config/config_defaults.hpp），本文件只列可覆盖项；删掉的键用默认值。
#
# 现状（2026-09-11，见 docs/decisions/_debt-log.md）：真正的 TOML 解析仍未落地
# （config_loader.cpp 目前只读编译期默认值 + {sid}/{appdata} 占位符展开，不读取这个
# 文件本身）——下面各节列的是 config_defaults.hpp 里已经在用的字段（[candidates]/
# [input]/[output]/[learning] 从各自里程碑起就是真实生效的默认值，不是"预留"），
# 这份文件是"配置将来长什么样"的权威草稿，TOML loader 接上后无需改调用方代码。

# zh-CN；language profile 注册用。一般不用改。
langid = 0x0804

[ipc]
# {sid} 运行期替换为当前用户 SID。
pipe_name_template = "\\\\.\\pipe\\myabc-engine-{sid}"
connect_timeout_ms = 2000        # 首次连接（含拉起引擎）总超时
request_timeout_ms = 50          # 单次按键请求超时，超时降级不阻塞宿主
connect_backoff_ms = [50, 100, 200, 400]

[engine]
# 相对 TIP DLL 所在目录；留空即同目录 myabc-engine.exe。
exe_path = "myabc-engine.exe"
model_dir = "data"                       # libpinyin 系统词库/模型目录（相对安装目录）
user_data_dir = "{appdata}/myabc/userdata"
idle_exit_minutes = 10                   # 引擎空闲自退出

